name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    name: Build & Test (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      # Package.swift declares iOS-only platforms (no macOS) — this app targets
      # motorcycles, not Macs, so plain `swift build`/`swift test` (which build for the
      # macOS host by default) can never work here. `xcodebuild test -scheme
      # SpeedJarvis-Package` runs the package's test targets on the iOS Simulator
      # instead, with no -project/-workspace needed — xcodebuild auto-discovers
      # Package.swift in the working directory and vends this umbrella scheme covering
      # every test target.
      - name: swift test (iOS Simulator via SpeedJarvis-Package)
        run: |
          xcodebuild test \
            -scheme SpeedJarvis-Package \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max' \
            2>&1

      # xcodebuild in a non-interactive CI runner has no one to click "Trust & Enable" on
      # the SPM macro plugins (SwiftRexMacros, FPMacrosPlugin) this project depends on —
      # confirmed on luizmb/tacos-mind and luizmb/PookiePayslip: "Macro ... must be
      # enabled before it can be used". These defaults are the standard headless-CI
      # workaround.
      - name: Trust SPM macro plugins for headless xcodebuild
        run: |
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      # CODE_SIGNING_ALLOWED=NO: this runner has no "Apple Development" certificate for
      # the project's team ID, and CI only needs to confirm the code builds, not produce
      # a signed artifact.
      - name: xcodebuild SpeedJarvis
        run: |
          xcodebuild build \
            -project Sources/SpeedJarvis.xcodeproj \
            -scheme SpeedJarvis \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1
