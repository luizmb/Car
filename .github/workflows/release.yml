name: Release

on:
  push:
    branches:
      - 'release/*'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ============================================================================
  # RELEASE CANDIDATE BUILD - Triggered on release/* branches
  # ============================================================================

  rc-test:
    name: RC - Test & Validate
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      # See ci.yml's identical step for why this uses xcodebuild test against the
      # package directly (no -project) rather than plain swift test.
      - name: swift test (iOS Simulator via SpeedJarvis-Package)
        run: |
          xcodebuild test \
            -scheme SpeedJarvis-Package \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max' \
            2>&1

      # See ci.yml's identical step for why this is needed.
      - name: Trust SPM macro plugins for headless xcodebuild
        run: |
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      # See ci.yml's identical step for why CODE_SIGNING_ALLOWED=NO is needed.
      - name: xcodebuild SpeedJarvis
        run: |
          xcodebuild build \
            -project Sources/SpeedJarvis.xcodeproj \
            -scheme SpeedJarvis \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1

      # Real signing, so a bad cert/profile/team-id fails HERE, not on the TestFlight
      # upload after the RC already got tagged and released. See promote-testflight.yml's
      # identical steps for why the .p12 is imported (not left to -allowProvisioningUpdates
      # to auto-create — Apple caps active distribution certs per team, so CI must reuse
      # one pinned cert rather than mint a fresh one every run) and why the API key lands
      # at Xcode's well-known search path.
      - name: Import distribution certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DISTRIBUTION_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Set up App Store Connect API key
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_P8" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8

      # Written at build time, gitignored, never committed — DEVELOPMENT_TEAM only ever
      # exists in this file or in the GitHub secret, matching the local-dev pattern in
      # Sources/Config/Local.xcconfig.example.
      #
      # CODE_SIGN_STYLE/CODE_SIGN_IDENTITY/PROVISIONING_PROFILE_SPECIFIER go here too, not
      # as xcodebuild command-line overrides — confirmed the hard way on
      # luizmb/PookiePayslip and luizmb/biokinetics-dosimetry: a command-line override
      # applies to the ENTIRE build graph, including the SwiftPM macro plugin host tools
      # (FPMacrosPlugin, SwiftRexMacros) this project depends on, which have no team
      # configured and fail with "requires a development team" once forced into Manual
      # style. Sources/Config/Shared.xcconfig's baseConfigurationReference only applies
      # to this app's own native-target build settings, not the plugins, so writing the
      # overrides here instead is correctly scoped.
      - name: Write CI-only signing config
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          cat >> Sources/Config/Local.xcconfig <<XCCONFIG
          DEVELOPMENT_TEAM = ${DEVELOPMENT_TEAM}
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = SpeedJarvis AppStore Distribution
          XCCONFIG

      # A device-generic (not simulator) build, since simulator builds never need real
      # signing at all — this is the actual App Store signing path, done here so it fails
      # the RC rather than the eventual TestFlight promotion.
      #
      # -allowProvisioningUpdates alone (CODE_SIGN_STYLE=Automatic) mints a brand-new
      # "Created via API" Development certificate on every single run — confirmed the hard
      # way, 7 accumulated in one day on luizmb/PookiePayslip's account. This runs on every
      # release/* push, so left alone it silently piles up a fresh cert per RC. Pinning
      # Distribution signing (via Local.xcconfig above, not a command-line override — see
      # that step's comment) stops it from ever touching Development certs at all.
      - name: xcodebuild SpeedJarvis (signed)
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          xcodebuild build \
            -project Sources/SpeedJarvis.xcodeproj \
            -scheme SpeedJarvis \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID" \
            2>&1

      - name: Clean up signing keychain and API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf ~/.appstoreconnect

      - name: Extract RC Version
        id: version
        run: |
          BRANCH="${{ github.ref_name }}"
          VERSION=${BRANCH#release/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "RC Version: ${VERSION}"

  rc-notify-status:
    name: RC - Notify Status
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    needs: [rc-test]
    steps:
      - name: Extract Version
        id: version
        run: |
          BRANCH="${{ github.ref_name }}"
          VERSION=${BRANCH#release/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Success Notification
        if: success()
        run: |
          echo "::notice::Release Candidate ${{ steps.version.outputs.version }} is ready for promotion"
          echo "Run 'Promote RC to Release' workflow when ready."

      - name: Failure Notification
        if: failure()
        run: |
          echo "::error::Release Candidate build failed — review failed jobs and push fixes to ${{ github.ref_name }}"

  # ============================================================================
  # RELEASE PROMOTION - Triggered on version tags (v*.*.*)
  # ============================================================================

  promote-test:
    name: Promote - Verify Tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Tag Format
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Invalid tag format: $TAG"
            echo "Expected format: vX.Y.Z"
            exit 1
          fi
          echo "::notice::Promoting tag: $TAG"

      - name: Verify Tag on Release Branch
        run: |
          TAG="${{ github.ref_name }}"
          VERSION=${TAG#v}

          if git show-ref --verify --quiet "refs/remotes/origin/release/$VERSION"; then
            echo "::notice::Found corresponding release branch: release/$VERSION"
          else
            echo "::warning::No release branch found for release/$VERSION"
            echo "It's OK to proceed if the tag is on master branch"
          fi

  create-release:
    name: Promote - Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: promote-test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Release Notes
        id: notes
        run: |
          TAG="${{ github.ref_name }}"
          PREV_TAG=$(git describe --tags --abbrev=0 ${TAG}^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            BODY="Initial release"
          else
            COMMITS=$(git log ${PREV_TAG}..${TAG} --oneline)
            BODY="## Changes

          ${COMMITS}"
          fi

          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            --notes "${{ steps.notes.outputs.body }}"
        env:
          GH_TOKEN: ${{ github.token }}

  notify-promotion-status:
    name: Promote - Notify Status
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [promote-test, create-release]
    steps:
      - name: Success Notification
        if: success()
        run: |
          echo "::notice::Release ${{ github.ref_name }} published successfully"
          echo ""
          echo "View release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}"

      - name: Failure Notification
        if: failure()
        run: |
          echo "::error::Release promotion failed for tag ${{ github.ref_name }}"
          echo ""
          echo "This tag has been pushed but the release may not be complete."
          echo "See workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          echo "Recovery:"
          echo "1. Delete the tag: git tag -d ${{ github.ref_name }} && git push origin :refs/tags/${{ github.ref_name }}"
          echo "2. Fix issues locally"
          echo "3. Retry: git tag ${{ github.ref_name }} && git push origin ${{ github.ref_name }}"
